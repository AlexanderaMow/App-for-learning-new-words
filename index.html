<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Слова</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f4b27a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Слова">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--ink:#4a3826;--muted:#8a7660;--paper:#fffaee;--card:#fffefb;--line:#f3e7c9;--accent:#f4b27a;--on:#4a2a10;--ok:#a9d3a0;--bad:#f2a99a;--lang:#e8a05a;--at:#b4561c;--dt:#b4432f;--kt:#3e7d3a}
@media (prefers-color-scheme:dark){:root{--ink:#f6e9d0;--muted:#c4b296;--paper:#2c2517;--card:#383020;--line:#4f4430;--accent:#f4b27a;--on:#3a2410;--ok:#a9d3a0;--bad:#f2a99a;--at:#f4b27a;--dt:#f2a99a;--kt:#a9d3a0}}
[data-lang=en]{--lang:#8fb3dd}[data-lang=fr]{--lang:#ec9aa6}[data-lang=de]{--lang:#e8c85e}[data-lang=nl]{--lang:#f2a66a}[data-lang=it]{--lang:#97c79b}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;padding:20px 18px 48px}
h1{font:600 30px/1.2 Georgia,"Times New Roman",serif;margin:12px 0 6px}
h2{font:600 20px Georgia,serif;margin:28px 0 8px}
.muted{color:var(--muted)}.small{font-size:14px}
.brand{font:700 18px Georgia,serif;color:var(--at)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.link{background:none;border:0;padding:8px 0;color:var(--at);min-height:40px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.btn{flex:1 1 140px;min-height:48px;padding:10px 16px;border-radius:10px;border:2px solid var(--accent);background:var(--accent);color:var(--on);font-weight:600}
.btn.ghost{background:transparent;color:var(--at)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.list,.words{list-style:none;margin:16px 0;padding:0}
.list li{margin-bottom:10px}
.mod{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:8px solid var(--lang);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column}
.mod span{color:var(--muted);font-size:14px}
.words li{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.ico{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--lang);display:grid;place-items:center;flex:none}
.ico svg{width:22px;height:22px;fill:currentColor}
label{display:block;margin:14px 0;font-weight:600}
input,select,textarea{display:block;width:100%;margin-top:6px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:400}
textarea{resize:vertical}
.bar{display:flex;justify-content:space-between;align-items:center}
.flip{perspective:900px;height:280px;margin:12px 0;cursor:pointer}
.in{position:relative;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.face,.card{background:var(--card);border:1px solid var(--line);border-left:10px solid var(--lang);border-radius:14px;padding:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.bk{transform:rotateY(180deg)}
.card{min-height:200px;margin:12px 0}
.w{font:600 40px/1.15 Georgia,"Times New Roman",serif;overflow-wrap:anywhere}
small{color:var(--muted)}
.fb{font-weight:600;margin:6px 0}.okt{color:var(--ok)}.badt{color:var(--bad)}.err{color:var(--bad)}
.big{font:600 56px Georgia,serif;margin:10px 0}
@media (prefers-reduced-motion:reduce){.in{transition:none}}
.err,.badt{color:var(--dt)}.okt{color:var(--kt)}.btn.danger{color:var(--dt);border-color:var(--dt)}
.btn.ok,.btn.bad{color:#33210f}.ico{color:var(--at)}
.grp{font-weight:600;margin:22px 0 6px}
.opt{display:flex;align-items:center;gap:10px;font-weight:400;margin:8px 0;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer}
.opt input{width:20px;height:20px;margin:0;padding:0;border:0;flex:none;accent-color:#e8924a}
.warn{background:#fde8c8;border:1px solid #f0b36b;border-radius:10px;padding:12px;font-size:14px;color:#4a2a10;margin:0 0 14px}
.steps{padding-left:20px;margin:10px 0}.steps li{margin:6px 0}
.mod.fld{border-left-color:var(--accent);background:var(--paper)}
#app{padding-top:max(20px,env(safe-area-inset-top));padding-bottom:max(48px,env(safe-area-inset-bottom))}
.ins{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 16px 8px;margin:14px 0}
.ins h2{margin:14px 0 4px;font-size:18px}
#vbox{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));max-width:616px;max-height:80vh;overflow:auto;margin:0 auto;background:var(--card);color:var(--ink);border:2px solid var(--accent);border-radius:14px;padding:16px 18px;z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.3)}
#vbox p{margin:8px 0}#vbox .btn{width:100%;margin-top:6px}
#toast{display:none;position:fixed;left:16px;right:16px;bottom:max(16px,env(safe-area-inset-bottom));max-width:608px;margin:0 auto;background:#4a2a10;color:#fff;border-radius:10px;padding:12px 14px;font-size:14px;z-index:10;box-shadow:0 4px 16px rgba(0,0,0,.25)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const LANGS={en:['Английский','en-GB'],fr:['Французский','fr-FR'],de:['Немецкий','de-DE'],nl:['Нидерландский','nl-NL'],it:['Итальянский','it-IT']};
const KEY='slova-v1';
const SPK='<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';
const $=s=>document.querySelector(s),app=$('#app');
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STORE_OK=(()=>{try{localStorage.setItem('slova-t','1');return localStorage.getItem('slova-t')==='1'}catch(e){return false}})();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
const WARN='<p class="warn"><b>Браузер не сохраняет данные этого сайта.</b> Слова пропадут после обновления страницы. Открой сайт в обычном (не приватном) окне Chrome или Safari по адресу github.io, а не во встроенном просмотре или в браузере внутри мессенджера. Пока что можно сделать «Резервную копию» (кнопка внизу главной страницы).</p>';
function load(k,def){try{const j=JSON.parse(localStorage.getItem(k));if(Array.isArray(j))return j}catch(e){}return def}
function readSavedData(){
 try{
  const j=JSON.parse(localStorage.getItem(KEY));
  if(j&&typeof j==='object'&&!Array.isArray(j)&&Array.isArray(j.mods)&&Array.isArray(j.folders))
   return {mods:j.mods,folders:j.folders};
  // Поддержка старого формата, если он использовался в предыдущей версии сайта.
  if(Array.isArray(j))return {mods:j,folders:load('slova-folders',[])};
 }catch(e){}
 return null;
}
const savedData=readSavedData();
function save(){try{localStorage.setItem(KEY,JSON.stringify({folders,mods}));localStorage.setItem('slova-folders',JSON.stringify(folders))}catch(e){console.error('Не удалось сохранить данные:',e)}}
let mods=savedData?savedData.mods:[{id:uid(),name:'Французский: пример',lang:'fr',words:[{f:'la maison',r:'дом'},{f:'le chat',r:'кот'},{f:'bonjour',r:'здравствуйте'},{f:'merci beaucoup',r:'большое спасибо'},{f:'l’école',r:'школа'}]}],folders=savedData?savedData.folders:load('slova-folders',[]),view={name:'home'},S=null;
const cur=()=>mods.find(m=>m.id===view.id);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const alts=(s,ru)=>{const o=[];let d=0,c='';for(const ch of s){if(ch==='(')d++;if(ch===')')d=Math.max(0,d-1);if(!d&&(ch==='/'||ch===';'||(ru&&ch===','))){o.push(c);c=''}else c+=ch}o.push(c);return o};
function judge(inp,ans,ru){
 const prep=s=>{let x=cfg.paren?s:s.replace(/\s*\([^)]*\)/g,'');x=x.replace(/[’‘]/g,"'").trim().replace(/\s+/g,' ');return cfg.case?x:x.toLowerCase()};
 const plain=s=>prep(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'');
 const raw=alts(ans,ru),a=raw.map(prep).filter(Boolean),pa=raw.map(plain).filter(Boolean),x=prep(inp);
 if(!x)return 'bad';
 if(a.includes(x))return 'ok';
 if(!ru&&pa.includes(plain(inp)))return 'accent';
 return 'bad'}
function parse(t){const lines=t.split('\n').map(l=>l.trim()).filter(Boolean);
 const words=lines.map(l=>{const p=l.split(/\s+[-–—]\s+|\t|;/);return p.length>1?{f:p[0].trim(),r:p.slice(1).join(' — ').trim()}:null}).filter(x=>x&&x.f&&x.r);
 return {words,skipped:lines.length-words.length}}
let VOICES=[],toastT=0;
const loadVoices=()=>{try{VOICES=speechSynthesis.getVoices()||[]}catch(e){}};
const L3={en:'eng',fr:'fra',de:'deu',nl:'nld',it:'ita'};
function toast(msg){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';t.setAttribute('role','status');document.body.appendChild(t)}
 t.textContent=msg;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>{t.style.display='none'},9000)}
const NATIVE={en:'English',fr:'Français',de:'Deutsch',nl:'Nederlands',it:'Italiano'};
const shownVB=new Set();
const platform=()=>{const ua=navigator.userAgent||'',pf=navigator.platform||'';
 if(/iPhone|iPad|iPod/.test(ua)||(pf==='MacIntel'&&navigator.maxTouchPoints>1))return 'ios';
 if(/Android/.test(ua))return 'android';if(/Mac/.test(pf))return 'mac';if(/Win/.test(pf))return 'win';return 'other'};
function noVoice(lang,auto){
 if(auto&&shownVB.has(lang))return;shownVB.add(lang);
 const e=Object.entries(LANGS).find(([k,x])=>x[1]===lang),code=e?e[0]:'',nm=e?e[1][0]:lang,label=nm+(NATIVE[code]?' ('+NATIVE[code]+')':'');
 const P={
  ios:['Открой «Настройки» на устройстве.','Выбери «Универсальный доступ», затем «Устный контент», затем «Голоса».','Найди язык: '+label+', выбери любой голос и нажми значок скачивания (облако со стрелкой).','Дождись окончания загрузки, полностью закрой приложение и открой его снова.'],
  android:['Открой «Настройки» на устройстве.','Выбери «Система» (на некоторых телефонах «Общие настройки»), затем «Язык и ввод», затем «Синтез речи».','Нажми на значок шестерёнки рядом с «Google Синтез речи» и выбери «Установить голосовые данные».','Найди язык: '+label+' и нажми значок скачивания. Потом закрой приложение и открой его снова.'],
  mac:['Открой «Системные настройки», затем «Универсальный доступ», затем «Устный контент».','Нажми «Системный голос», затем «Управление голосами».','Найди язык: '+label+', отметь любой голос и скачай его.'],
  win:['Открой «Параметры», затем «Время и язык», затем «Речь».','В разделе «Управление голосами» нажми «Добавить голоса».','Найди язык: '+label+' и установи его. Затем перезапусти браузер.'],
  other:['Открой настройки системы и найди раздел про синтез речи или устный контент (на iPhone: «Универсальный доступ», на Android: «Язык и ввод»).','Добавь голос для языка: '+label+'.','Закрой приложение и открой его снова.']}[platform()];
 let b=$('#vbox');if(b)b.remove();b=document.createElement('div');b.id='vbox';b.setAttribute('role','dialog');b.setAttribute('aria-label','Нет голоса для озвучки');
 b.innerHTML='<b>Нет голоса для языка: '+esc(nm.toLowerCase())+'</b><p>Телефон или планшет не умеет произносить слова на этом языке, пока не скачан голос. Это делается один раз в настройках устройства:</p><ol class="steps">'+P.map(s=>'<li>'+s+'</li>').join('')+'</ol><p class="muted small">Если голос уже скачан, а окошко всё равно появляется, попробуй открыть сайт в другом браузере (например, Firefox или Яндекс Браузер).</p><p class="muted small">Браузер сейчас видит голоса для: '+esc([...new Set(VOICES.map(v=>String(v.lang||'').replace('_','-')))].sort().join(', ')||'ни одного языка')+'</p><button class="btn" data-act="closevb">Понятно</button>';
 document.body.appendChild(b)}
function pickVoice(lang){
 const two=lang.slice(0,2).toLowerCase(),three=L3[two],norm=v=>String(v.lang||'').replace('_','-').toLowerCase();
 const same=VOICES.filter(v=>{const l=norm(v);return l===two||l.startsWith(two+'-')||(three&&(l===three||l.startsWith(three+'-')))});
 return same.find(v=>norm(v)===lang.toLowerCase())||same.find(v=>v.localService)||same[0]||null}
function speak(text,lang,auto){
 if(!('speechSynthesis' in window)){if(!auto)toast('В этом браузере нет озвучки.');return}
 loadVoices();
 const v=pickVoice(lang);
 // Если браузер не показал голос для языка, всё равно пробуем: многие браузеры (например, на Huawei) не перечисляют
 // все голоса, но система умеет читать нужный язык. Окошко с инструкцией показывается только при реальной ошибке.
 speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=v?v.lang:lang;
 if(v)u.voice=v;u.rate=.9;
 u.onerror=e=>{if(e&&(e.error==='language-unavailable'||e.error==='synthesis-unavailable'||e.error==='voice-unavailable'))noVoice(lang,auto)};
 speechSynthesis.speak(u)}
if('speechSynthesis' in window){loadVoices();try{speechSynthesis.addEventListener('voiceschanged',loadVoices);speechSynthesis.addEventListener('voiceschanged',()=>{if(typeof view!=='undefined'&&view.name==='voices')render()})}catch(e){}}

const back=(act,label,id)=>`<button class="link" data-act="${act}" ${id?`data-id="${id}"`:''}>← ${label}</button>`;
const wd=(t,sp,l)=>`<div class="w">${esc(t)}</div>${sp?`<button class="ico" data-act="speak" data-lang="${l}" data-say="${esc(t)}" aria-label="Озвучить">${SPK}</button>`:''}`;
const fold=id=>folders.find(f=>f.id===id);
const inF=fid=>mods.filter(m=>m.fid===fid);
const nW=ms=>ms.reduce((s,m)=>s+m.words.length,0);
const studyItems=()=>(view.fid?inF(view.fid):[cur()]).flatMap(m=>m.words.map(w=>({f:w.f,r:w.r,lang:m.lang,miss:0})));
const srcTitle=()=>view.fid?fold(view.fid).name:cur().name;
const exitB=()=>view.fid?back('fold','Выйти',view.fid):back('open','Выйти',view.id);
const modBtn=m=>`<li><button class="mod" data-act="open" data-id="${m.id}" data-lang="${m.lang}"><b>${esc(m.name)}</b><span>${LANGS[m.lang][0]}, слов: ${m.words.length}</span></button></li>`;

function vHome(){const loose=mods.filter(m=>!m.fid||!fold(m.fid));
 return `<div class="brand">Слова</div>${view.note?`<p class="okt">${esc(view.note)}</p>`:''}<h1>Мои модули</h1>`+
 (folders.length?`<h2>Папки</h2><ul class="list">${folders.map(f=>`<li><button class="mod fld" data-act="fold" data-id="${f.id}"><b>${esc(f.name)}</b><span>модулей: ${inF(f.id).length}, слов: ${nW(inF(f.id))}</span></button></li>`).join('')}</ul>`:'')+
 (loose.length?`${folders.length?'<h2>Без папки</h2>':''}<ul class="list">${loose.map(modBtn).join('')}</ul>`:'')+
 (!mods.length?'<p class="muted">Пока нет ни одного модуля. Создай первый: впиши слова и переводы списком.</p>':'')+
 `<div class="row"><button class="btn" data-act="new">Новый модуль</button><button class="btn ghost" data-act="newf">Новая папка</button></div><div class="row"><button class="btn ghost" data-act="recv">Получить от друга</button><button class="btn ghost" data-act="share">Резервная копия</button><button class="btn ghost" data-act="voices">Проверка озвучки</button>${isStandalone()?'':'<button class="btn ghost" data-act="install">Ярлык на экран</button>'}</div>`}

const isStandalone=()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}};
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(view.name==='install')render()});
window.addEventListener('appinstalled',()=>{deferredInstall=null;view={name:'home',note:'Готово: ярлык добавлен.'};render()});
const SAMPLE={en:'Good morning',fr:'Bonjour',de:'Guten Morgen',nl:'Goedemorgen',it:'Buongiorno'};
function vVoices(){loadVoices();
 const rows=VOICES.map(v=>`<li><span>${esc(v.name||'')}</span><span class="muted">${esc(String(v.lang||''))}</span><span></span></li>`).join('');
 return back('home','Все модули')+`<h1>Проверка озвучки</h1>
<p class="muted">Нажми на кнопку каждого языка. Слово должно прозвучать на своём языке. Если немецкий и нидерландский звучат одинаково, значит, браузер не умеет выбирать язык.</p>
<div class="row">${Object.keys(SAMPLE).map(k=>`<button class="btn ghost" data-act="vtest" data-code="${k}">${LANGS[k][0]}: ${esc(SAMPLE[k])}</button>`).join('')}</div>
<h2>Голоса, которые видит браузер: ${VOICES.length}</h2>
${VOICES.length?`<ul class="words">${rows}</ul>`:'<p class="muted">Ни одного. Браузер не показывает сайту список голосов, но озвучка всё равно может работать.</p>'}
<p class="muted small">Браузер: ${esc(navigator.userAgent||'')}</p>`}
function vInstall(){
 return back('home','Все модули')+`<h1>Ярлык на экран</h1>
<p class="muted">Приложение «Слова» появится среди других иконок, с твоим фото, и будет открываться на весь экран, без адресной строки. Слова уже сохранены в браузере и в ярлыке не потеряются.</p>
${deferredInstall?'<div class="row"><button class="btn" data-act="doinstall">Добавить ярлык</button></div>':''}
<div class="ins"><h2>iPhone и iPad (Safari)</h2><ol class="steps"><li>Открой сайт именно в Safari, не в Chrome и не внутри мессенджера.</li><li>Нажми кнопку «Поделиться» (квадрат со стрелкой вверх).</li><li>Выбери «На экран “Домой”» и нажми «Добавить».</li></ol></div>
<div class="ins"><h2>Android (Chrome)</h2><ol class="steps"><li>Нажми меню ⋮ в правом верхнем углу.</li><li>Выбери «Установить приложение» или «Добавить на главный экран».</li></ol></div>
<div class="ins"><h2>Компьютер (Chrome, Edge)</h2><ol class="steps"><li>В адресной строке справа найди значок установки (монитор со стрелкой) и нажми на него.</li><li>Или открой меню ⋮ и выбери «Установить “Слова”».</li></ol></div>
<div class="ins"><h2>Mac (Safari)</h2><ol class="steps"><li>В меню выбери «Файл», затем «Добавить в Dock».</li></ol></div>

 return back('home','Все модули')+`<h1>${esc(f.name)}</h1><p class="muted">Модулей: ${ms.length}, слов: ${n}</p>
${n?`<div class="row"><button class="btn" data-act="cards">Карточки по всей папке</button><button class="btn" data-act="write">Ввод по всей папке</button></div>`:''}

const b64e=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d=s=>JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/')))));
const pack=m=>({n:m.name,l:m.lang,w:m.words.map(w=>[w.f,w.r])});
const okP=d=>d&&Array.isArray(d.ms)&&d.ms.length&&d.ms.every(m=>m&&LANGS[m.l]&&m.n&&Array.isArray(m.w));
const shareData=()=>view.fid?{fn:fold(view.fid).name,ms:inF(view.fid).map(pack)}:{ms:[pack(cur())]};
const bytesToB64Url=bytes=>{let bin='';for(let i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const b64UrlToBytes=s=>{const bin=atob(s.replace(/-/g,'+').replace(/_/g,'/'));const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a};
async function shareLink(){const base=location.href.split('#')[0],json=JSON.stringify(shareData());
 try{if(typeof CompressionStream==='function'){const stream=new Blob([new TextEncoder().encode(json)]).stream().pipeThrough(new CompressionStream('gzip'));const bytes=new Uint8Array(await new Response(stream).arrayBuffer());return base+'#z='+bytesToB64Url(bytes)}}catch(e){}
 return base+'#m='+b64e(shareData())}
async function readShareHash(hash){if(hash.startsWith('#z=')){if(typeof DecompressionStream!=='function')throw Error('Этот браузер не поддерживает сжатые ссылки. Обнови Safari или Chrome.');const bytes=b64UrlToBytes(hash.slice(3));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));return JSON.parse(new TextDecoder().decode(await new Response(stream).arrayBuffer()))}if(hash.startsWith('#m='))return b64d(hash.slice(3));return null}
const clearHash=()=>{try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}};

<ol class="steps"><li>Нажми «Скопировать ссылку».</li><li>Вставь её в сообщение другу (Telegram, WhatsApp, почта).</li><li>Друг открывает ссылку, и сайт предлагает добавить ${f?'папку с модулями':'модуль'} к его словам. У тебя ничего не меняется.</li></ol>

<div class="row"><button class="btn" data-act="cards">Карточки</button><button class="btn" data-act="write">Ввод перевода</button></div>
<ul class="words">${m.words.map(w=>`<li><span>${esc(w.f)}</span><span class="muted">${esc(w.r)}</span><button class="ico" data-act="speak" data-lang="${m.lang}" data-say="${esc(w.f)}" aria-label="Озвучить ${esc(w.f)}">${SPK}</button></li>`).join('')}</ul>

function vEdit(){const d=view.draft;return (view.id?back('open','Назад',view.id):view.fid?back('fold','Назад',view.fid):back('home','Все модули'))+`<h1>${view.id?'Редактирование':'Новый модуль'}</h1>

<label>Слова: по одному в строке, «слово — перевод»<textarea id="tx" rows="10" placeholder="la maison — дом&#10;le chat — кот">${esc(d.text)}</textarea></label>
<p class="muted small">Между словом и переводом поставь тире с пробелами или точку с запятой. Если у слова есть варианты написания, раздели их знаком «/»: colour / color — цвет.</p>

function vSetup(){const w=view.mode==='write';
 return (view.fid?back('fold','Назад',view.fid):back('open','Назад',view.id))+`<h1>${w?'Ввод перевода':'Карточки'}</h1><p class="muted">${esc(srcTitle())}, слов: ${studyItems().length}</p>
<p class="grp">${w?'Что вводить':'Что показывать сначала'}</p>
<label class="opt"><input type="radio" name="show" value="r" ${cfg.show==='r'?'checked':''}>${w?'Иностранное слово, показывается русское':'Русское слово'}</label>
<label class="opt"><input type="radio" name="show" value="f" ${cfg.show==='f'?'checked':''}>${w?'Перевод на русский, показывается иностранное слово':'Иностранное слово'}</label>
${w?`<p class="grp">Как проверять</p><label class="opt"><input type="checkbox" id="cs" ${cfg.case?'checked':''}>Учитывать регистр (большие и маленькие буквы)</label><label class="opt"><input type="checkbox" id="pr" ${cfg.paren?'checked':''}>Учитывать пояснения в скобках ()</label>`:''}
<p class="muted small">Слова идут в случайном порядке. Если ошибиться, слово вернётся в следующий круг, и так до тех пор, пока все слова не получатся.</p>
<div class="row"><button class="btn" data-act="go">Начать</button></div>`}

function vCards(){const w=S.deck[S.i],r=cfg.show==='r',f=r?w.r:w.f,b=r?w.f:w.r;
 return exitB()+`<div class="bar"><span class="muted">Круг ${S.round}: ${S.i+1} из ${S.deck.length}</span><span class="muted">${LANGS[w.lang][0]}</span></div>
<div class="flip" data-act="flip" data-lang="${w.lang}"><div class="in"><div class="face">${wd(f,!r,w.lang)}<small>нажми, чтобы перевернуть</small></div><div class="face bk">${wd(b,r,w.lang)}</div></div></div>
<div class="row"><button class="btn bad" data-act="dont">Не знаю</button><button class="btn ok" data-act="know">Знаю</button></div>`}

function vWrite(){const w=S.deck[S.i],c=S.checked,ru=cfg.show==='f',ans=ru?w.r:w.f;let fb='';
 if(c)fb=c.res==='ok'?`<p class="fb okt">${c.forced?'Засчитано как верное':'Верно'}</p>`:`<p class="fb badt">${c.res==='accent'?'Почти: проверь акценты и буквы с диакритикой. ':''}Правильно: ${esc(ans)}</p>`;
 return exitB()+`<div class="bar"><span class="muted">Круг ${S.round}: ${S.i+1} из ${S.deck.length}</span><span class="muted">${LANGS[w.lang][0]}</span></div>
<div class="card" data-lang="${w.lang}">${wd(ru?w.f:w.r,ru,w.lang)}<small>${ru?'Напиши перевод на русский':`Напиши перевод (${LANGS[w.lang][0].toLowerCase()} язык)`}</small></div>
<input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Ответ" ${c?`disabled value="${esc(c.val)}"`:''}>
${fb}<div class="row">${c&&c.res!=='ok'?'<button class="btn ghost" data-act="force">Засчитать как верное (опечатка)</button>':''}<button class="btn" data-act="${c?'next':'check'}">${c?'Дальше':'Проверить'}</button></div>`}

function vRes(){const n=S.all.length,miss=S.all.reduce((s,w)=>s+w.miss,0),first=S.all.filter(w=>!w.miss).length,pct=Math.round(n/(n+miss)*100);
 return `<h1>Готово</h1><p class="big">${pct}%</p><p class="muted">Столько материала освоено с учётом ошибок.</p><p>Слов: ${n}. С первого раза: ${first}. Ошибок: ${miss}. Кругов: ${S.round}.</p>
<div class="row"><button class="btn" data-act="again">Ещё раз</button><button class="btn ghost" data-act="setup">Настройки</button><button class="btn ghost" data-act="${view.fid?'fold':'open'}" data-id="${view.fid||view.id}">${view.fid?'К папке':'К модулю'}</button></div>`}

function vReceive(){return back('home','Все модули')+`<h1>Получить от друга</h1>
<p class="muted">Друг нажимает «Поделиться» на странице своего модуля и присылает тебе ссылку. Вставь её в поле ниже и нажми «Добавить».</p>
<textarea id="im" rows="4" placeholder="Вставь сюда ссылку"></textarea>

<p id="fbk" class="muted small"></p>
${view.note?`<p class="err">${esc(view.note)}</p>`:''}
<p class="muted small">Можно и просто открыть присланную ссылку в браузере: сайт сам предложит добавить модуль.</p>`}

function vShare(){return back('home','Все модули')+`<h1>Резервная копия</h1>
<p class="muted">Здесь все твои папки и модули одним текстом. Скопируй его и сохрани в заметки или отправь себе в мессенджер. Чтобы восстановить слова, открой «Получить от друга» и вставь этот текст.</p>
<textarea id="ex" rows="6" readonly>${esc(JSON.stringify({folders,mods}))}</textarea>
<div class="row"><button class="btn" data-act="copy">Скопировать всё</button></div>
<p id="fbk" class="muted small"></p>`}

function render(){const v=view.name;
 app.innerHTML=(STORE_OK?'':WARN)+({home:vHome,mod:vMod,fold:vFold,fname:vFname,receive:vReceive,share1:vShare1,incoming:vIncoming,edit:vEdit,cards:vCards,write:vWrite,res:vRes,setup:vSetup,share:vShare,install:vInstall,voices:vVoices})[v]();
 app.dataset.lang=cur()?cur().lang:'';
 const i=$('#fn')||(S&&!S.checked?$('#ans'):null);if(i)i.focus();
 if(!(v==='write'&&S.checked))window.scrollTo(0,0);
 if(v==='share1')shareLink().then(link=>{const ex=$('#ex');if(ex)ex.value=link;const w=$('#linkwarn');if(w&&link.length>8000)w.textContent='Ссылка всё ещё очень длинная. Возможно, стоит разделить папку на несколько частей.'}).catch(()=>{const f=$('#fbk');if(f)f.textContent='Не удалось подготовить ссылку.'})}

let cfg=Object.assign({show:'r',case:false,paren:false},(()=>{try{return JSON.parse(localStorage.getItem('slova-cfg'))||{}}catch(e){return{}}})());
function start(mode,items){S={mode,all:items,deck:shuffle(items.slice()),i:0,round:1,wrong:[],checked:null};view={name:mode,id:view.id,fid:view.fid};render()}
function adv(){S.i++;S.checked=null;
 if(S.i>=S.deck.length){if(S.wrong.length){S.deck=shuffle(S.wrong);S.wrong=[];S.i=0;S.round++}else view.name='res'}
 render()}

async function copyText(s){try{await navigator.clipboard.writeText(s);return true}catch(e){}
 try{const ta=$('#ex');ta.focus();ta.select();ta.setSelectionRange(0,999999);return document.execCommand('copy')}catch(e){return false}}
const ACT={
 home(){view={name:'home'};render()},
 fold(b,id){view={name:'fold',fid:id};render()},
 newf(){view={name:'fname'};render()},
 renf(){view={name:'fname',fid:view.fid};render()},
 sf(){const n=$('#fn').value.trim();
  if(!n){view.err='Впиши название папки.';render();return}
  if(view.fid){fold(view.fid).name=n;save();view={name:'fold',fid:view.fid}}
  else{const f={id:uid(),name:n};folders.push(f);save();view={name:'fold',fid:f.id}}
  render()},
 delf(b){if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Нажми ещё раз, чтобы удалить';return}
  mods.forEach(m=>{if(m.fid===view.fid)m.fid=''});folders=folders.filter(f=>f.id!==view.fid);save();ACT.home()},
 addm(){const ids=[...document.querySelectorAll('.pk:checked')].map(e=>e.value);if(!ids.length)return;
  mods.forEach(m=>{if(ids.includes(m.id))m.fid=view.fid});save();render()},
 new(){view={name:'edit',fid:view.fid,draft:{name:'',lang:'en',text:'',fid:view.fid||''}};render()},
 open(b,id){view={name:'mod',id};render()},
 edit(){const m=cur();view={name:'edit',id:m.id,draft:{name:m.name,lang:m.lang,fid:m.fid||'',text:m.words.map(w=>w.f+' — '+w.r).join('\n')}};render()},
 save(){const d={name:$('#nm').value.trim(),lang:$('#lg').value,fid:$('#fl')?$('#fl').value:'',text:$('#tx').value},p=parse(d.text);
  if(!d.name)d.err='Впиши название модуля.';
  else if(!p.words.length)d.err='Не нашлось ни одной пары «слово — перевод». Проверь, что между ними стоит тире с пробелами или точка с запятой.';
  if(d.err){view.draft=d;render();return}
  if(view.id){const m=cur();m.name=d.name;m.lang=d.lang;m.fid=d.fid;m.words=p.words}
  else{const m={id:uid(),name:d.name,lang:d.lang,fid:d.fid,words:p.words};mods.push(m);view.id=m.id}
  save();view={name:'mod',id:view.id,note:p.skipped?'Строк без перевода пропущено: '+p.skipped:''};render()},
 del(b){if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Нажми ещё раз, чтобы удалить';return}
  const f=cur().fid;mods=mods.filter(m=>m.id!==view.id);save();f&&fold(f)?ACT.fold(null,f):ACT.home()},
 cards(){view={name:'setup',id:view.id,fid:view.fid,mode:'cards'};render()},
 write(){view={name:'setup',id:view.id,fid:view.fid,mode:'write'};render()},
 setup(){view={name:'setup',id:view.id,fid:view.fid,mode:S.mode};render()},
 go(){const e=document.querySelector('input[name=show]:checked');if(e)cfg.show=e.value;
  if(view.mode==='write'){cfg.case=$('#cs').checked;cfg.paren=$('#pr').checked}
  try{localStorage.setItem('slova-cfg',JSON.stringify(cfg))}catch(x){}
  start(view.mode,studyItems())},
 flip(b){b.classList.toggle('on')},
 know(){adv()},
 dont(){const w=S.deck[S.i];w.miss++;S.wrong.push(w);adv()},
 check(){const w=S.deck[S.i],val=$('#ans').value,ru=cfg.show==='f',res=judge(val,ru?w.r:w.f,ru);
  S.checked={res,val};if(res!=='ok'){w.miss++;S.wrong.push(w)}
  speak(w.f.split('/')[0].trim(),LANGS[w.lang][1],true);render()},
 closevb(){const b=$('#vbox');if(b)b.remove()},
 force(){const c=S.checked,w=S.deck[S.i];if(c&&c.res!=='ok'){S.wrong=S.wrong.filter(x=>x!==w);w.miss=Math.max(0,w.miss-1);c.res='ok';c.forced=1}render()},
 next(){adv()},
 again(){start(S.mode,studyItems())},
 speak(b){speak(b.dataset.say.split('/')[0].trim(),LANGS[b.dataset.lang][1])},
 share(){view={name:'share'};render()},
 install(){view={name:'install'};render()},
 voices(){view={name:'voices'};render()},
 vtest(b){const k=b.dataset.code;if(SAMPLE[k]&&LANGS[k])speak(SAMPLE[k],LANGS[k][1])},
 doinstall(){const p=deferredInstall;if(!p)return;deferredInstall=null;p.prompt();p.userChoice.finally(()=>render())},
 share1(){view={name:'share1',id:view.id,fid:view.fid};render()},
 nshare(){const f=$('#fbk'),no='Меню отправки не открылось. Нажми «Скопировать ссылку» и вставь её в сообщение.';
  shareLink().then(url=>navigator.share({title:srcTitle(),url})).catch(e=>{if(!e||e.name!=='AbortError')f.textContent=no})},
 acc(){const d=view.data;let fid='',last=null;if(d.fn){fid=uid();folders.push({id:fid,name:String(d.fn)})}
  d.ms.forEach(m=>{const ws=m.w.filter(x=>Array.isArray(x)&&x[0]&&x[1]).map(x=>({f:String(x[0]),r:String(x[1])}));
   if(ws.length){last={id:uid(),name:String(m.n),lang:m.l,fid,words:ws};mods.push(last)}});
  save();clearHash();view=d.fn?{name:'fold',fid}:last?{name:'mod',id:last.id}:{name:'home'};render()},
 rej(){clearHash();ACT.home()},
 copy(){const f=$('#fbk');copyText($('#ex').value).then(ok=>{f.textContent=ok?'Скопировано.':'Само скопировать не получилось. Нажми на поле со ссылкой, выдели весь текст и скопируй вручную.'})},
 recv(){view={name:'receive'};render()},
 paste(){const f=$('#fbk'),no='Браузер не дал прочитать буфер. Нажми в поле выше, удерживай и выбери «Вставить».';
  try{navigator.clipboard.readText().then(s=>{$('#im').value=s;f.textContent=''}).catch(()=>{f.textContent=no})}catch(e){f.textContent=no}},
 imp(){(async()=>{try{const txt=$('#im').value.trim(),hashAt=txt.indexOf('#');
